 try{await audio.play();status((cacheSaved?'已读取本机保存音轨':'当前会话音轨')+' · 正在播放 · 已有动画 '+CLIP_START.toFixed(2)+'—'+CLIP_END.toFixed(2)+' 秒')}
 catch(e){status('播放未启动：'+e.name+'。请再点击播放。')}
}
$('play').onclick=()=>audio.paused?play():audio.pause();
$('restart').onclick=()=>{seek(0);play()};
$('sample').onclick=()=>{seek(CLIP_START);play()};
$('seek').oninput=e=>seek(Number(e.target.value));
$('chapter').onchange=e=>seek(Number(e.target.value)-LEGACY_AUDIO_OFFSET);
$('grid').onchange=$('crt').onchange=()=>{atlas=null;lastKey='';paint(clock())};
$('immersive').onclick=()=>{document.body.classList.toggle('immersive');resize()};
$('stage').onclick=()=>{if(document.body.classList.contains('immersive')){$('immersive').click()}};
window.addEventListener('resize',resize);
window.addEventListener('keydown',e=>{if(e.target.matches('input,select'))return;
 if(e.code==='Space'){e.preventDefault();$('play').click()}
 if(e.code==='ArrowLeft')seek(clock()-5);if(e.code==='ArrowRight')seek(clock()+5);
 if(e.code==='Escape'){document.body.classList.remove('immersive');resize()}
});
audio.addEventListener('loadedmetadata',()=>{
 mediaReady=true;const d=audio.duration;if(Number.isFinite(d)&&d>0){$('seek').max=d}
 seek(Math.min(pausedPreviewTime,duration()));
 const sameDuration=Math.abs(duration()-TRACK.duration)<.7;
 status((cacheSaved?'本机保存音轨已就绪':'音轨已就绪')+' · '+duration().toFixed(2)+' 秒 · '+(sameDuration?'可按209秒时间轴试听':'时长不匹配，可能不同步！'));
});
audio.addEventListener('play',()=>{$('play').textContent='暂停'});
audio.addEventListener('pause',()=>{$('play').textContent='播放'});
audio.addEventListener('error',()=>{mediaReady=false;status('音频解码失败：请尝试 Safari 支持的 MP3 或 MP4 文件。')});
audio.addEventListener('seeking',()=>{lastKey=''});
for(const e of ['seeked','timeupdate','loadeddata'])audio.addEventListener(e,()=>{lastKey='';paint(clock())});
function useMedia(blob,name,restored=false){
 if(blobURL)URL.revokeObjectURL(blobURL);blobURL=URL.createObjectURL(blob);
 selectedName=name;mediaReady=false;audio.pause();audio.src=blobURL;audio.load();
 if(restored)status('正在读取本机保存的音轨…');else status('正在载入 '+name+'…');
}
function openDB(){return new Promise((resolve,reject)=>{
 if(!('indexedDB' in window)){reject(Error('此浏览器不支持本地文件存储'));return}
 const req=indexedDB.open('seed-personal-player',2);
 req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('tracks'))req.result.createObjectStore('tracks')};
 req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||Error('IndexedDB 访问失败'));
})}
async function cacheWrite(value){const d=await openDB();try{return await new Promise((resolve,reject)=>{
 const tx=d.transaction('tracks','readwrite');tx.objectStore('tracks').put(value,STORE_KEY);
 tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error||Error('无法保存音轨'));tx.onabort=()=>reject(tx.error||Error('保存已中断'));
})}finally{d.close()}}
async function cacheRead(){const d=await openDB();try{return await new Promise((resolve,reject)=>{
 const tx=d.transaction('tracks','readonly');const req=tx.objectStore('tracks').get(STORE_KEY);
 req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||Error('读取失败'));
})}finally{d.close()}}
async function importMedia(e){const f=e.target.files?.[0];e.target.value='';if(!f)return;
 try{
  useMedia(f,f.name);cacheSaved=false;
  let exact=false;
  if(f.size===TRACK.bytes&&window.crypto?.subtle){
   try{let hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',await f.arrayBuffer())),v=>v.toString(16).padStart(2,'0')).join('');exact=hash===TRACK.sha256}catch(e){}
  }
  try{await cacheWrite({blob:f,name:f.name,exact});cacheSaved=true;status((exact?'209秒固定音轨已校验':'音轨已保存（未校验为原MP3）')+' · 后续打开无需重复选择 · 点击播放')}
  catch(err){status('本次音轨已载入，但浏览器未保存：'+err.message+'。下次可能需重新选择。')}
 }catch(err){status('载入失败：'+err.message)}
}
$('file').onchange=$('videoFile').onchange=importMedia;
async function restore(){try{
 const entry=await cacheRead();if(entry?.blob){cacheSaved=true;useMedia(entry.blob,entry.name||'本机音轨',true)}
 else status('首次选择一次本地 209 秒音轨（MP3 或包含同一音乐的视频）。文件只保存在你的浏览器中，不会上传 GitHub。');
 }catch(e){status('无法读取本机存储，请选择一次音频。Safari 私密浏览或清除网站数据后可能需要重新导入。')}
}
function loop(now){const targetFPS=Number($('fps').value)||30;
 if(now-last>=1000/targetFPS-1){last=now;
 const t=clock(),key=t.toFixed(3)+'/'+$('grid').value+'/'+$('crt').checked;
 if(key!==lastKey){paint(t);lastKey=key}
 }
 requestAnimationFrame(loop)
}
window.Pilot={paint,seek,clock,clipStart:CLIP_START,clipEnd:CLIP_END};
resize();paint(CLIP_START);requestAnimationFrame(loop);restore();

</script></body></html>
