    <title>SEED / 原创 ASCII MV</title>
    <style>* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: #0b0c0d;
  color: #e3d9c7;
  font:
    15px system-ui,
    -apple-system,
    sans-serif;
  padding: env(safe-area-inset-top) env(safe-area-inset-right)
    env(safe-area-inset-bottom) env(safe-area-inset-left);
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 22px;
  border-bottom: 1px solid #333;
}
strong {
  letter-spacing: 0.14em;
  color: #ffd787;
}
small {
  display: block;
  margin-top: 5px;
  color: #a9a49a;
}
a {
  color: #bcb6a8;
}
main {
  display: flex;
  flex-direction: column;
  height: calc(100vh - 76px);
  height: calc(100dvh - 76px);
  min-height: 430px;
}
#stage {
  flex: 1;
  min-height: 140px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #080909;
  overflow: hidden;
}
canvas {
  display: block;
  max-width: 100%;
  max-height: 100%;
}
.controls {
  padding: 10px 20px 12px;
  border-top: 1px solid #333;
  background: #141617;
}
.row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin: 6px 0;
}
button,
select,
input[type="number"],
.file {
  font: inherit;
  min-height: 44px;
  border: 1px solid #4a463e;
  border-radius: 7px;
  background: #232525;
  color: #eee3d1;
  padding: 8px 12px;
}
button,
.file {
  cursor: pointer;
  touch-action: manipulation;
}
button:active {
  background: #514737;
}
button:disabled {
  opacity: 0.4;
}
#play {
  min-width: 90px;
  background: #e7bd72;
  color: #141414;
}
label {
  display: flex;
  align-items: center;
  gap: 8px;
}
.file input {
  width: 1px;
  height: 1px;
  position: absolute;
  opacity: 0;
}
.file:focus-within {
  outline: 2px solid #ffd787;
}
input[type="range"] {
  flex: 1;
  min-width: 140px;
  min-height: 44px;
  accent-color: #e7bd72;
  touch-action: pan-y;
}
input[type="number"] {
  width: 95px;
}
output {
  font-variant-numeric: tabular-nums;
}
#status,
p {
  font-size: 12px;
  color: #b6b1a6;
}
p {
  margin: 8px 0 0;
}
body:fullscreen main {
  height: calc(100dvh - 76px);
}
@media (max-width: 700px) {
  header {
    padding: 10px;
  }
  header a {
    font-size: 12px;
  }
  .controls {
    padding: 6px 10px;
  }
  .row {
    gap: 6px;
  }
  #status {
    flex-basis: 100%;
  }
  main {
    height: auto;
    min-height: calc(100dvh - 76px);
  }
  #stage {
    min-height: 45vh;
  }
  label {
    font-size: 12px;
  }
}
#stage {
  position: relative;
  background: #000;
}
canvas {
  background: #000;
}
.transport {
  flex-wrap: nowrap;
}
#seek {
  min-width: 60px;
}
details {
  border-top: 1px solid #34382f;
  padding-top: 7px;
}
summary {
  min-height: 35px;
  padding: 6px;
  cursor: pointer;
  color: #a5b798;
}
input[type="checkbox"] {
  width: 22px;
  height: 22px;
  accent-color: #b5d18d;
}
#debug {
  position: absolute;
  left: 14px;
  top: 12px;
  background: #000b;
  font: 12px monospace;
  color: #8aaa98;
  pointer-events: none;
}
#showControls {
  position: absolute;
  right: 16px;
  bottom: 16px;
  opacity: 0.65;
}
body.immersive header,
body.immersive .controls {
  display: none;
}
body.immersive main {
  height: 100dvh;
  min-height: 0;
}
body.immersive #stage {
  min-height: 0;
}
#showControls[hidden],
#debug[hidden] {
  display: none;
}
header strong {
  font-size: 13px;
}
button:focus-visible,
select:focus-visible,
input:focus-visible,
summary:focus-visible {
  outline: 2px solid #b0d297;
}
@media (max-width: 700px) {
  .transport {
    flex-wrap: wrap;
  }
  #seek {
    flex-basis: 100%;
  }
  #hideControls {
    font-size: 12px;
  }
  header strong {
    font-size: 11px;
  }
}
</style>

        <strong>SEED / A COMPUTATIONAL SHORT</strong

      </div>

          <button id="restart" aria-label="从头开始">↺</button

            aria-label="进度"
            type="range"
            min="0"
            max="30"
            value="0"
            step="0.01"
          /><button id="hideControls">沉浸模式</button>
        </div>
        <details>
          <summary>设置 / 场景与画质</summary>
          <div class="row">
            <label
              >场景
              <select id="chapter">
                <option value="0">01 · SYSTEM BOOT</option>
                <option value="5">02 · MATHEMATICAL CREATION</option>
                <option value="11">03 · DATA DIMENSION</option>
                <option value="18">04 · EMERGENT LIFE</option>
                <option value="25">05 · CONSCIOUSNESS</option>
              </select></label
            ><label
              >字符网格
              <select id="grid">
                <option value="100,36">100 × 36 · 标准</option>
                <option value="128,44">128 × 44 · 精细</option>
                <option value="80,30">80 × 30 · 性能</option>
              </select></label
            ><label
              >帧率
              <select id="quality">
                <option value="30">30 FPS</option>
                <option value="24">24 FPS</option>
              </select></label
            ><label
              >动画偏移 / 秒
              <input
                id="offset"
                type="number"
                min="-30"
                max="30"
                step="0.05"
                value="0" /></label
            ><label
              ><input id="reactive" type="checkbox" checked />音频响应</label
            ><label><input id="debugToggle" type="checkbox" />场景与 FPS</label
            ><button id="fullscreen">全屏</button>
          </div>
          <p>
            固定 30 秒预览。正偏移使动画提前；FFT
            驱动几何形变、字符密度与运动，并不等于人工校准节拍。无第三方音乐或歌词。
          </p>
        </details>
      </section>
    </main>
