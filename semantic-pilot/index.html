(function (R) {
  class AudioAnalysis {
    constructor(audio) {
      this.audio = audio;
      this.context = null;
      this.source = null;
      this.analyser = null;
      this.enabled = true;
      this.failed = false;
      this.value = { bass: 0, rms: 0 };
    }
    async unlock() {
      if (this.failed) return;
      try {
        if (!this.context) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) {
            this.failed = true;
            return;
          }
          this.context = new AC();
        }
        if (this.context.state === "suspended") await this.context.resume();
        if (this.context.state !== "running") return;

          this.source.connect(this.context.destination);

$('immersive').onclick=()=>{document.body.classList.toggle('immersive');resize()};$('stage').onclick=()=>{if(document.body.classList.contains('immersive')){document.body.classList.remove('immersive');resize()}};
window.addEventListener('keydown',e=>{if(e.target.matches('input,select'))return;if(e.code==='Space'){e.preventDefault();$('play').click()}if(e.code==='ArrowLeft')seek(clock()-.25);if(e.code==='ArrowRight')seek(clock()+.25);if(e.code==='Escape'){document.body.classList.remove('immersive');resize()}});
function resize(){let box=$('stage').getBoundingClientRect(),w=Math.min(box.width,box.height*16/9);canvas.style.width=w+'px';canvas.style.height=w*9/16+'px'}window.addEventListener('resize',resize);
function makeAtlas(w,h){const cw=14,ch=22;atlas=document.createElement('canvas');atlas.width=95*cw;atlas.height=palette.length*ch;let a=atlas.getContext('2d',{alpha:false});a.fillStyle='#030806';a.fillRect(0,0,atlas.width,atlas.height);a.font='18px Menlo,Consolas,monospace';a.textAlign='center';a.textBaseline='middle';for(let c=0;c<4;c++){a.fillStyle=palette[c];for(let i=0;i<95;i++)a.fillText(String.fromCharCode(32+i),i*cw+cw/2,c*ch+ch/2)}if($('crt').checked){a.fillStyle='rgba(0,0,0,.13)';for(let y=1;y<atlas.height;y+=4)a.fillRect(0,y,atlas.width,1)}activeGrid=w+','+h;canvas.width=w*cw;canvas.height=h*ch;previous=null;previousCRT=$('crt').checked;ctx.imageSmoothingEnabled=false}
function paint(t,opts={}){let [w,h]=$('grid').value.split(',').map(Number);if(!atlas||activeGrid!==w+','+h||previousCRT!==$('crt').checked)makeAtlas(w,h);let g=Seed.render(t,w,h,opts);for(let i=0;i<g.ch.length;i++){if(previous&&previous.ch[i]===g.ch[i]&&previous.col[i]===g.col[i])continue;let c=g.ch[i].charCodeAt(0)-32;if(c<0||c>94)c=0;ctx.drawImage(atlas,c*14,g.col[i]*22,14,22,(i%w)*14,Math.floor(i/w)*22,14,22)}previous=g;
 canvas.dataset.scene=Seed.scene(t);canvas.dataset.time=t.toFixed(3);$('seek').value=t;$('time').textContent=t.toFixed(3)+' / 21.600';return g}
function loop(now){if(now-last>=1000/+$('fps').value-1){last=now-((now-last)%(1000/+$('fps').value));let t=clock();if(t>=Seed.END&&(running||!audio.paused)){stop();if(!silent&&audio.src)audio.currentTime=Seed.END}let key=t.toFixed(4)+'/'+$('grid').value;if(key!==lastKey){paint(t);lastKey=key;frameCount++}if(now-frameStart>1000){measuredFPS=frameCount;frameCount=0;frameStart=now}analysis.sample()}requestAnimationFrame(loop)}
// Read-only capture/control API also makes deterministic scene inspection reproducible.
window.Pilot={paint,seek,clock,get fps(){return measuredFPS},get analysis(){return analysis}};
resize();paint(Seed.START);requestAnimationFrame(loop);

</script></body></html>
