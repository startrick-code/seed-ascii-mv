'use strict';
const $=id=>document.getElementById(id),audio=$('audio'),canvas=$('screen'),ctx=canvas.getContext('2d',{alpha:false}),analysis=new AudioAnalysis(audio);
const palette=['#294638','#f1c779','#77bb87','#9be1d2','#ffefc6','#a17e47'];
let url='',silent=false,running=false,silentT=Seed.START,anchor=0,last=-1,lastKey='',atlas=null,activeGrid='',frameCount=0,frameStart=0,measuredFPS=0,previous=null,previousCRT=null,lastFeatures={rms:0,bass:0};
const status=s=>$('status').textContent=s;
function clock(){return silent?(running?Math.min(Seed.END,silentT+(performance.now()-anchor)/1000):silentT):(audio.src?Math.max(Seed.START,Math.min(Seed.END,audio.currentTime)):silentT)}
function stop(){if(silent){silentT=clock();running=false}else audio.pause();$('play').textContent='播放'}
function seek(t){t=Math.max(Seed.START,Math.min(Seed.END,t));analysis.reset();lastFeatures={rms:0,bass:0};if(silent||!audio.src){silentT=t;anchor=performance.now()}else audio.currentTime=t;lastKey='';paint(t)}
async function play(){if(!silent&&!audio.src){status('请导入本地完整音乐，或点击无声预览');return}if(clock()>=Seed.END-.025)seek(Seed.START);if(silent){anchor=performance.now();running=true}else{try{const unlock=analysis.unlock();await audio.play();await unlock}catch(e){status('未能播放，请再次点击，或选择 Safari 支持的 MP3 / AAC 文件');return}}$('play').textContent='暂停'}
$('play').onclick=()=>((silent?running:!audio.paused)?stop():play());$('restart').onclick=()=>seek(Seed.START);
$('silent').onclick=()=>{stop();silent=true;lastFeatures={rms:0,bass:0};silentT=Seed.START;lastKey='';status('无声演示：独立时钟；导入音乐后切回音频主时钟');play()};
$('file').onchange=e=>{let f=e.target.files[0];if(!f)return;e.target.value='';stop();silent=false;audio.removeAttribute('src');audio.load();if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);audio.src=url;audio.load();status('读取本地音频…')};
audio.addEventListener('loadedmetadata',()=>{if(audio.duration<Seed.END){status('音频短于 21.600 秒。请导入完整歌曲，不能使用裁切片段');audio.removeAttribute('src');audio.load();return}seek(Seed.START);status('音乐就绪 · 点击播放 · 可关闭画面标签观看故事')});
audio.addEventListener('error',()=>status('音频无法解码，请选择 MP3 / AAC / WAV 文件'));
audio.addEventListener('seeking',()=>{analysis.reset();lastKey=''});audio.addEventListener('pause',()=>{$('play').textContent='播放'});audio.addEventListener('ended',stop);
$('seek').oninput=e=>seek(+e.target.value);$('chapter').onchange=e=>seek(+e.target.value);$('grid').onchange=()=>{atlas=null;lastKey='';paint(clock())};$('crt').onchange=()=>{lastKey='';paint(clock())};
$('immersive').onclick=()=>{document.body.classList.toggle('immersive');resize()};$('stage').onclick=()=>{if(document.body.classList.contains('immersive')){document.body.classList.remove('immersive');resize()}};
window.addEventListener('keydown',e=>{if(e.target.matches('input,select'))return;if(e.code==='Space'){e.preventDefault();$('play').click()}if(e.code==='ArrowLeft')seek(clock()-.25);if(e.code==='ArrowRight')seek(clock()+.25);if(e.code==='Escape'){document.body.classList.remove('immersive');resize()}});
function resize(){let box=$('stage').getBoundingClientRect(),w=Math.min(box.width,box.height*16/9);canvas.style.width=w+'px';canvas.style.height=w*9/16+'px'}window.addEventListener('resize',resize);
function makeAtlas(w,h){const cw=14,ch=22;atlas=document.createElement('canvas');atlas.width=95*cw;atlas.height=palette.length*ch;let a=atlas.getContext('2d',{alpha:false});a.fillStyle='#030806';a.fillRect(0,0,atlas.width,atlas.height);a.font='18px Menlo,Consolas,monospace';a.textAlign='center';a.textBaseline='middle';for(let c=0;c<palette.length;c++){a.fillStyle=palette[c];for(let i=0;i<95;i++)a.fillText(String.fromCharCode(32+i),i*cw+cw/2,c*ch+ch/2)}if($('crt').checked){a.fillStyle='rgba(0,0,0,.13)';for(let y=1;y<atlas.height;y+=4)a.fillRect(0,y,atlas.width,1)}activeGrid=w+','+h;canvas.width=w*cw;canvas.height=h*ch;previous=null;previousCRT=$('crt').checked;ctx.imageSmoothingEnabled=false}
function paint(t,opts={}){let [w,h]=$('grid').value.split(',').map(Number);if(!atlas||activeGrid!==w+','+h||previousCRT!==$('crt').checked)makeAtlas(w,h);let g=Seed.render(t,w,h,{labels:$('labels').checked,features:$('reactive').checked?lastFeatures:{rms:0,bass:0},...opts});for(let i=0;i<g.ch.length;i++){if(previous&&previous.ch[i]===g.ch[i]&&previous.col[i]===g.col[i])continue;let c=g.ch[i].charCodeAt(0)-32;if(c<0||c>94)c=0;ctx.drawImage(atlas,c*14,g.col[i]*22,14,22,(i%w)*14,Math.floor(i/w)*22,14,22)}previous=g;
 canvas.dataset.scene=Seed.scene(t);canvas.dataset.time=t.toFixed(3);$('seek').value=t;$('time').textContent=t.toFixed(3)+' / 21.600';return g}
function loop(now){if(now-last>=1000/+$('fps').value-1){last=now-((now-last)%(1000/+$('fps').value));let t=clock();if(t>=Seed.END&&(running||!audio.paused)){stop();if(!silent&&audio.src)audio.currentTime=Seed.END}let key=t.toFixed(4)+'/'+$('grid').value;if(key!==lastKey){if(!silent&&!audio.paused&&!audio.seeking)lastFeatures=analysis.sample();paint(t);lastKey=key;frameCount++}if(now-frameStart>1000){measuredFPS=frameCount;frameCount=0;frameStart=now}}requestAnimationFrame(loop)}
// Read-only capture/control API also makes deterministic scene inspection reproducible.
window.Pilot={paint,seek,clock,get fps(){return measuredFPS},get analysis(){return analysis},get features(){return {...lastFeatures}}};
$('labels').onchange=$('reactive').onchange=()=>{lastKey='';paint(clock())};
resize();paint(Seed.START);requestAnimationFrame(loop);

</script></body></html>
